# The current latest alpine/socat image on Docker Hub is 1.8.1.3.
# Keep the tag and digest in sync when updating the image.
image:
  repository: alpine/socat
  tag: "1.8.1.3"
  digest: "sha256:3d9e7966201dd3a065df591020a09fd3c70845de7e7086e3531ea69db774406b"
  pullPolicy: IfNotPresent

# Required: the hostname or IP address of the database to tunnel to.
dbhost: ""
# Port on dbhost where the database accepts connections.
dbport: 3306
# Port where socat listens inside the cluster.
listenPort: 3306

service:
  type: ClusterIP
  port: 5432

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
