apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "socat-tunneler.fullname" . }}
  labels:
    {{- include "socat-tunneler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "socat-tunneler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "socat-tunneler.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: socat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "TCP-LISTEN:{{ .Values.listenPort }},fork,reuseaddr"
            - "TCP:{{ required "Values.dbhost must be set" .Values.dbhost }}:{{ .Values.dbport }}"
          ports:
            - name: tunnel
              containerPort: {{ .Values.listenPort }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: tunnel
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: tunnel
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
