name: Validate Helm chart

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    name: Lint and render chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint chart
        run: helm lint charts/socat-tunneler --set-string dbhost=database.example.internal

      - name: Render chart
        run: helm template socat-tunneler charts/socat-tunneler --namespace db-tunnel --set-string dbhost=database.example.internal
